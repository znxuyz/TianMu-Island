name: 出爐（Release）

# 三種觸發方式：
#   1. 【主要】main 分支的 Directory.Build.props 版本號改變，且該版本尚未發佈 → 自動出爐
#   2. 推送 v 開頭的標籤（例如 v0.3.0）
#   3. 在 Actions 頁面手動執行，輸入版本號（例如 0.3.0）
# 會自動編譯、測試、打包 x64 與 ARM64 單檔 exe（附 .sha256 校驗檔）、建立標籤與 GitHub Release。
# 天幕島內建的自動更新就是讀取這裡發佈的檔案。
on:
  push:
    branches: [main]
    paths: ['Directory.Build.props']
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: '版本號（不含 v，例如 0.3.0）'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    env:
      TAG_FROM_PUSH: ${{ github.ref_name }}
      VERSION_INPUT: ${{ inputs.version }}
      EVENT: ${{ github.event_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 版本號
        id: ver
        shell: pwsh
        run: |
          if ($env:EVENT -eq 'workflow_dispatch') { $v = $env:VERSION_INPUT }
          elseif ($env:GITHUB_REF -like 'refs/tags/*') { $v = $env:TAG_FROM_PUSH.TrimStart('v') }
          else { $v = ([xml](Get-Content Directory.Build.props -Raw)).Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1 }
          if ($v -notmatch '^\d+\.\d+\.\d+$') { throw "版本號格式必須是 X.Y.Z，收到：$v" }

          # 從 main 觸發時，已經發佈過的版本就跳過（只是改了其他設定）
          $skip = ($env:GITHUB_REF -eq 'refs/heads/main') -and (git tag -l "v$v")
          "version=$v" >> $env:GITHUB_OUTPUT
          "tag=v$v" >> $env:GITHUB_OUTPUT
          "skip=$($skip.ToString().ToLower())" >> $env:GITHUB_OUTPUT
          if ($skip) { Write-Host "v$v 已發佈過，略過。" }

      - uses: actions/setup-dotnet@v4
        if: steps.ver.outputs.skip != 'true'
        with:
          dotnet-version: 10.0.x

      - name: 試煉（單元測試）
        if: steps.ver.outputs.skip != 'true'
        run: dotnet test TianMu-Island.slnx -c Release -p:Version=${{ steps.ver.outputs.version }}

      - name: 出爐（x64 與 ARM64 單檔 exe + 校驗檔）
        if: steps.ver.outputs.skip != 'true'
        shell: pwsh
        run: |
          $v = "${{ steps.ver.outputs.version }}"
          New-Item -ItemType Directory -Force -Path release | Out-Null
          foreach ($rid in 'win-x64', 'win-arm64') {
            dotnet publish src/TianMu.Island/TianMu.Island.csproj `
              -c Release -r $rid --self-contained true `
              -p:PublishSingleFile=true -p:Version=$v `
              -o "dist/$rid"
            if ($LASTEXITCODE -ne 0) { throw "打包 $rid 失敗" }

            $name = "TianMuIsland-$rid.exe"
            Copy-Item "dist/$rid/TianMuIsland.exe" "release/$name"
            $hash = (Get-FileHash "release/$name" -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $name" | Out-File -Encoding ascii "release/$name.sha256"
          }
          Get-ChildItem release

      - uses: softprops/action-gh-release@v2
        if: steps.ver.outputs.skip != 'true'
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: 天幕島 ${{ steps.ver.outputs.tag }}
          generate_release_notes: true
          files: release/*
